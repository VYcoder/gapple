<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OXAD — симулятор кейсов Oxide</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2125;--panel:#262d32;--line:#38424a;--text:#e8e1d2;--mute:#8f9ba3;--rust:#c4572b;--rust2:#e0713f;--gold:#e0a53a;--win:#6dbb6a;--lose:#c9483f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
h1,h2,h3,.num,.btn,nav button{font-family:Oswald,'Arial Narrow',Impact,sans-serif;letter-spacing:.02em}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 20px;background:#14181b;border-bottom:3px solid var(--rust)}
.logo{font-size:26px;font-weight:700;color:var(--rust2)}
nav{display:flex;gap:6px}
nav button,.btn{font-size:16px;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:9px 18px;cursor:pointer;border-radius:4px}
nav button.on,.btn.on{background:var(--rust);border-color:var(--rust)}
.btn:hover:not(:disabled),nav button:hover{border-color:var(--rust2)}
.btn.main{background:var(--rust);border-color:var(--rust);font-size:18px;padding:12px 28px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bal{display:flex;gap:10px;align-items:center}.bal b{font-size:24px;color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.case{cursor:pointer;border-top:4px solid var(--k);padding:16px}
.case:hover{border-color:var(--k);transform:translateY(-3px)}
.case .ico{font-size:64px;line-height:1.3}
.price,.v{color:var(--gold);font-family:Oswald;font-size:18px}
.item{border-bottom:3px solid var(--k)}
.item .pic{height:72px;display:flex;align-items:center;justify-content:center;font-size:40px}
.item img{width:100%;height:72px;object-fit:contain}
.item .n{font-size:13px;font-weight:600;min-height:18px}
.item .w{font-size:11px;color:var(--mute);min-height:15px}
.pick{cursor:pointer}.pick.sel{outline:2px solid var(--rust2);background:#323a40}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
.modal.on{display:flex}
.box{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--rust);border-radius:6px;width:100%;max-width:900px;padding:18px;max-height:92vh;overflow:auto}
.roll{position:relative;overflow:hidden;background:#14181b;border:1px solid var(--line);margin:14px 0}
.roll::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--rust2);transform:translateX(-50%);z-index:2}
.strip{display:flex;gap:8px;padding:8px 0;will-change:transform}
.strip .item{flex:0 0 120px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.sp{justify-content:space-between}
.pool{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--mute)}
.pool span{border-bottom:2px solid var(--k);padding:2px 6px;background:var(--panel)}
.up{display:grid;grid-template-columns:1fr 340px;gap:18px}
@media(max-width:800px){.up{grid-template-columns:1fr}}
.wheelwrap{position:relative;width:260px;height:260px;margin:6px auto 12px}
.wheelwrap canvas{width:100%;height:100%;transition:transform 4.5s cubic-bezier(.12,.7,.1,1)}
.ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);border:11px solid transparent;border-top:20px solid var(--text);z-index:2}
.wc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.wc .num{font-size:34px}.wc small{color:var(--mute);font-size:12px}
.msg{min-height:28px;text-align:center;font-family:Oswald;font-size:20px;margin-top:8px}
.msg.w{color:var(--win)}.msg.l{color:var(--lose)}
.empty{color:var(--mute);text-align:center;padding:24px}
h2{font-size:24px;margin-bottom:12px}h3{font-size:16px;margin:12px 0 6px}
.targets{max-height:300px;overflow:auto;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){.strip,.wheelwrap canvas{transition-duration:.01s!important}}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="logo">OXAD</div>
  <nav>
    <button data-t="cases" class="on">Кейсы</button>
    <button data-t="upgrade">Апгрейд</button>
    <button data-t="inv">Инвентарь</button>
  </nav>
  <div class="bal"><b id="bal">0</b><button class="btn" id="bonus">Бонус +500</button></div>
</header>

<main>
  <section class="tab on" id="cases"><h2>Кейсы</h2><div class="grid" id="caseGrid"></div></section>

  <section class="tab" id="upgrade">
    <h2>Апгрейд</h2>
    <div class="up">
      <div>
        <h3>1. Выберите скины для апгрейда</h3>
        <div class="empty" id="upEmpty" hidden>Нет скинов. Откройте кейс.</div>
        <div class="grid" id="upInv"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">2. Выберите желаемый скин</h3>
        <div class="targets"><div class="grid" id="targets" style="grid-template-columns:repeat(2,1fr)"></div><div class="empty" id="tEmpty">Сначала выберите скины</div></div>
        <div class="wheelwrap">
          <div class="ptr"></div>
          <canvas id="wheel" width="520" height="520"></canvas>
          <div class="wc"><div class="num" id="chance">—</div><small id="upInfo"></small></div>
        </div>
        <button class="btn main" id="upBtn" disabled>Апгрейд</button>
        <div class="msg" id="upMsg"></div>
      </div>
    </div>
  </section>

  <section class="tab" id="inv">
    <div class="row sp"><h2>Инвентарь</h2><button class="btn" id="sellAll">Продать всё</button></div>
    <div class="empty" id="invEmpty" hidden>Пусто.</div>
    <div class="grid" id="invGrid"></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box">
  <div class="row sp"><h2 id="mTitle" style="margin:0"></h2><button class="btn" id="mClose">Закрыть</button></div>
  <div class="roll"><div class="strip" id="strip"></div></div>
  <div class="row"><button class="btn main" id="openBtn"></button></div>
  <div class="msg" id="mMsg"></div>
  <div class="pool" id="pool"></div>
</div></div>
<footer>Игровая валюта и скины виртуальные. Реальных денег и вывода нет. Проект фанатский.</footer>

<script src="skins.js"></script>
<script>
const RC={c:'#8d9aa0',u:'#5fa8a0',r:'#5b8fd6',e:'#a56bd0',l:'#e0a53a'};
const RN={c:'Обычный',u:'Необычный',r:'Редкий',e:'Эпический',l:'Легендарный'};
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ru-RU');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const skin=id=>SKINS.find(s=>s.id===id);
let S;try{S=JSON.parse(localStorage.getItem('oxad2'))}catch(e){}
if(!S||typeof S.bal!=='number')S={bal:1000,inv:[],bonusAt:0,id:1};
S.inv=S.inv.filter(i=>skin(i.sid));
const save=()=>{try{localStorage.setItem('oxad2',JSON.stringify(S))}catch(e){}};

function card(sk,cls='',attr=''){
  const pic=sk.img?`<img src="${sk.img}" alt="${sk.name}" loading="lazy">`:'🔫';
  return `<div class="card item ${cls}" ${attr} style="--k:${RC[sk.rarity]}"><div class="pic">${pic}</div><div class="n">${sk.name}</div><div class="w">${sk.weapon}</div><div class="v">${fmt(sk.value)}</div></div>`;
}
function roll(c){
  const rs=Object.keys(c.rar).filter(r=>SKINS.some(s=>s.rarity===r));
  let x=Math.random()*rs.reduce((a,r)=>a+c.rar[r],0),rar=rs[0];
  for(const r of rs){if((x-=c.rar[r])<0){rar=r;break}}
  return pick(SKINS.filter(s=>s.rarity===rar));
}

/* ---- общее ---- */
function renderAll(){
  $('bal').textContent=fmt(S.bal);save();
  $('invEmpty').hidden=S.inv.length>0;$('sellAll').disabled=!S.inv.length;
  $('invGrid').innerHTML=S.inv.map(i=>card(skin(i.sid),'pick',`data-i="${i.id}"`)).join('');
  $('invGrid').querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    const it=S.inv.find(i=>i.id==el.dataset.i);if(!it)return;
    S.bal+=skin(it.sid).value;S.inv=S.inv.filter(i=>i!==it);renderAll();
  });
  renderUp();
}
$('sellAll').onclick=()=>{S.bal+=S.inv.reduce((a,i)=>a+skin(i.sid).value,0);S.inv=[];renderAll()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on');
});
$('bonus').onclick=()=>{if(S.bonusAt+3e5>Date.now())return;S.bal+=500;S.bonusAt=Date.now();renderAll()};
setInterval(()=>{const l=S.bonusAt+3e5-Date.now();$('bonus').textContent=l>0?'Бонус через '+Math.ceil(l/1000)+' с':'Бонус +500'},1000);

/* ---- кейсы ---- */
$('caseGrid').innerHTML=CASES.map(c=>`<div class="card case" data-id="${c.id}" style="--k:${c.k}"><div class="ico">${c.ico}</div><h3>${c.name}</h3><div class="price">${fmt(c.price)}</div></div>`).join('');
document.querySelectorAll('.case').forEach(el=>el.onclick=()=>openModal(CASES.find(c=>c.id===el.dataset.id)));
let cur=null,busy=false;
const updOpen=()=>{$('openBtn').disabled=busy||S.bal<cur.price};
function openModal(c){
  cur=c;$('mTitle').textContent=c.name;$('openBtn').textContent='Открыть за '+fmt(c.price);$('mMsg').textContent='';
  $('strip').style.transition='none';$('strip').style.transform='none';
  $('strip').innerHTML=Array.from({length:12},()=>card(roll(c))).join('');
  const pool=SKINS.filter(s=>c.rar[s.rarity]);
  $('pool').innerHTML=pool.map(s=>`<span style="--k:${RC[s.rarity]}">${s.name}</span>`).join('');
  $('modal').classList.add('on');updOpen();
}
$('mClose').onclick=()=>{if(!busy)$('modal').classList.remove('on')};
$('openBtn').onclick=()=>{
  if(busy||S.bal<cur.price)return;busy=true;S.bal-=cur.price;$('bal').textContent=fmt(S.bal);updOpen();$('mMsg').textContent='';
  const W=40,items=Array.from({length:50},(_,i)=>roll(cur)),win=roll(cur);items[W]=win;
  const st=$('strip');st.style.transition='none';st.style.transform='translateX(0)';
  st.innerHTML=items.map(s=>card(s)).join('');void st.offsetWidth;
  const x=W*128+60+rnd(-50,50)-st.parentElement.clientWidth/2;
  st.style.transition='transform 6s cubic-bezier(.1,.6,.1,1)';st.style.transform=`translateX(${-x}px)`;
  setTimeout(()=>{
    S.inv.push({id:S.id++,sid:win.id});busy=false;
    $('mMsg').className='msg w';$('mMsg').textContent=`${win.name} — ${fmt(win.value)}`;
    renderAll();updOpen();
  },6100);
};

/* ---- апгрейд ---- */
let sel=new Set(),tgt=null,spinning=false,rot=0;
const sumSel=()=>S.inv.filter(i=>sel.has(i.id)).reduce((a,i)=>a+skin(i.sid).value,0);
const chanceOf=(sum,t)=>Math.min(90,95*sum/t.value);
function renderUp(){
  sel=new Set([...sel].filter(id=>S.inv.some(i=>i.id===id)));
  $('upEmpty').hidden=S.inv.length>0;
  $('upInv').innerHTML=S.inv.map(i=>card(skin(i.sid),'pick'+(sel.has(i.id)?' sel':''),`data-i="${i.id}"`)).join('');
  $('upInv').querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    if(spinning)return;const id=+el.dataset.i;sel.has(id)?sel.delete(id):sel.add(id);tgt=null;renderUp();
  });
  const sum=sumSel();
  const list=sel.size?SKINS.filter(s=>s.value>sum).sort((a,b)=>a.value-b.value).slice(0,10):[];
  if(tgt&&!list.includes(tgt))tgt=null;
  $('tEmpty').hidden=list.length>0;
  $('tEmpty').textContent=sel.size?'Нет скинов дороже выбранных':'Сначала выберите скины';
  $('targets').innerHTML=list.map(s=>card(s,'pick'+(s===tgt?' sel':''),`data-s="${s.id}"`)).join('');
  $('targets').querySelectorAll('.item').forEach(el=>el.onclick=()=>{if(!spinning){tgt=skin(el.dataset.s);renderUp()}});
  const ch=tgt?chanceOf(sum,tgt):0;
  $('chance').textContent=tgt?ch.toFixed(1)+'%':'—';
  $('upInfo').textContent=tgt?`${fmt(sum)} → ${fmt(tgt.value)}`:'';
  $('upBtn').disabled=!tgt||spinning;
  drawWheel(ch);
}
function drawWheel(ch){
  const c=$('wheel'),x=c.getContext('2d'),m=c.width/2,r=m-30;
  x.clearRect(0,0,c.width,c.width);x.lineWidth=36;
  x.strokeStyle='#c9483f';x.beginPath();x.arc(m,m,r,0,Math.PI*2);x.stroke();
  if(ch>0){x.strokeStyle='#6dbb6a';x.beginPath();x.arc(m,m,r,-Math.PI/2,-Math.PI/2+ch/100*Math.PI*2);x.stroke()}
}
$('upBtn').onclick=()=>{
  if(spinning||!tgt)return;
  const sum=sumSel(),ch=chanceOf(sum,tgt),res=Math.random()*100,win=res<ch,t=tgt;
  S.inv=S.inv.filter(i=>!sel.has(i.id));sel.clear();tgt=null;spinning=true;
  $('upBtn').disabled=true;$('upMsg').textContent='';$('upMsg').className='msg';
  const T=((-res*3.6)%360+360)%360;
  rot=rot-(rot%360)+360*6+T;
  $('wheel').style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{
    spinning=false;
    if(win){S.inv.push({id:S.id++,sid:t.id});$('upMsg').className='msg w';$('upMsg').textContent='Успех: '+t.name}
    else{$('upMsg').className='msg l';$('upMsg').textContent='Неудача: скины потеряны'}
    renderAll();
  },4700);
};

renderAll();
</script>
</body>
</html>
