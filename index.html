<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OXAD — симулятор кейсов Oxide</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#14181c;--panel:#21282f;--soft:#2a323a;--line:#ffffff12;--text:#ece6d9;--mute:#8f9aa3;--rust:#e0713f;--rust2:#c4472b;--gold:#f0be5c;--win:#6ed08a;--lose:#e0675c;--r:14px}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{background:radial-gradient(900px 500px at 50% -120px,#2b3540,transparent),var(--bg);color:var(--text);font:400 14px/1.4 Inter,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
header{max-width:900px;margin:0 auto;padding:16px 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:600;letter-spacing:.08em;background:linear-gradient(90deg,var(--rust),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{display:flex;gap:8px;align-items:center}
.chip{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe29a,var(--gold) 55%,#b9852a)}
.chip b{font-size:16px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.btn{background:var(--soft);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--rust);background:#323b44}
.btn.main{background:linear-gradient(180deg,var(--rust),var(--rust2));border:0;font-weight:500;font-size:15px;padding:12px 34px;box-shadow:0 6px 18px #e0713f44}
.btn.main:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(180deg,var(--rust),var(--rust2))}
.btn:disabled{opacity:.4;cursor:not-allowed}
nav{display:flex;gap:4px;padding:4px;margin:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:999px;max-width:420px}
@media(min-width:900px){nav{margin:0 auto 0 calc(50% - 450px + 16px)}}
nav button{flex:1;border:0;background:none;padding:9px 6px;border-radius:999px;cursor:pointer;color:var(--mute);transition:.15s}
nav button.on{background:var(--soft);color:var(--text);box-shadow:0 0 0 1px var(--line)}
main{max-width:900px;margin:0 auto;padding:18px 16px 40px}
.tab{display:none}.tab.on{display:block}
h2{font-size:18px;font-weight:600;margin-bottom:12px}
h3{font-size:13px;font-weight:500;color:var(--mute);margin-bottom:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.scroll{max-height:210px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3b454e transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cases{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.case{cursor:pointer;padding:20px 10px;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 0,color-mix(in srgb,var(--k) 26%,transparent),transparent 70%),var(--panel);transition:.2s}
.case:hover{transform:translateY(-3px);border-color:var(--k);box-shadow:0 10px 26px color-mix(in srgb,var(--k) 25%,transparent)}
.case .ico{font-size:52px;line-height:1.2;filter:drop-shadow(0 6px 10px #0008)}
.case .nm{font-size:14px;font-weight:500;margin:6px 0 2px}
.v,.price{color:var(--gold);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.item{background:linear-gradient(180deg,color-mix(in srgb,var(--k) 18%,var(--soft)),var(--soft) 80%);border-bottom:2px solid var(--k)}
.item .pic{height:40px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
.item img{max-width:100%;max-height:40px;object-fit:contain}
.item .n{font-size:11.5px;line-height:1.25;height:29px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-top:2px}
.pick{cursor:pointer;transition:.12s}.pick:hover{filter:brightness(1.15)}
.pick.sel{outline:2px solid var(--rust);outline-offset:-2px;box-shadow:0 0 14px #e0713f55}
.empty{color:var(--mute);text-align:center;padding:16px 8px;font-size:13px}
.up{display:grid;gap:12px}
@media(min-width:760px){.up{grid-template-columns:1fr 290px;align-items:start}}
.up>*{min-width:0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:12px;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:16px;max-height:92vh;overflow:auto}
.roll{position:relative;overflow:hidden;background:#101417;border-radius:12px;margin:12px 0}
.roll::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);transform:translateX(-50%);z-index:2}
.strip{display:flex;gap:8px;padding:8px 0;will-change:transform}
.strip .item{flex:0 0 100px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.sp{justify-content:space-between}
.pool{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:11px;color:var(--mute)}
.pool span{border-bottom:2px solid var(--k);padding:2px 7px;background:var(--soft);border-radius:6px}
/* колесо */
.wheelpanel{text-align:center;background:radial-gradient(circle at 50% 38%,#2d3a46,var(--panel) 70%)}
.wheelwrap{position:relative;width:240px;height:240px;margin:14px auto 18px;border-radius:50%;box-shadow:0 0 0 6px #ffffff08,0 0 40px #0008}
.wheelwrap canvas{width:100%;height:100%;display:block;transition:transform 5s cubic-bezier(.1,.75,.12,1)}
.wheelwrap.win{animation:ring 1.1s ease-out 2}
.wheelwrap.lose{animation:shake .45s}
@keyframes ring{0%{box-shadow:0 0 0 6px #6ed08aaa,0 0 40px #6ed08a88}100%{box-shadow:0 0 0 46px #6ed08a00,0 0 40px #0008}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);border:10px solid transparent;border-top:20px solid var(--gold);filter:drop-shadow(0 2px 6px #000a);z-index:2}
.wc{position:absolute;inset:18%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle at 50% 30%,#2e3842,#171c20);box-shadow:inset 0 0 0 1px #ffffff10,inset 0 8px 20px #0006}
.wc .num{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}.wc small{color:var(--mute);font-size:11px;margin-top:2px}
.msg{min-height:24px;text-align:center;font-size:15px;font-weight:500;margin-top:10px}
.msg.w{color:var(--win)}.msg.l{color:var(--lose)}
/* показ выигрыша */
#rv{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--k) 30%,#0b0e11),#0b0e11 75%);overflow:hidden}
#rv.on{display:flex}
.rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--k) 24%,transparent) 0 8deg,transparent 8deg 16deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 55%);mask-image:radial-gradient(circle,#000,transparent 55%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rvc{position:relative;text-align:center;max-width:460px;width:100%;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.rvc .t{font-size:15px;color:var(--mute);margin-bottom:10px}
.rvc .pic{filter:drop-shadow(0 0 28px color-mix(in srgb,var(--k) 70%,transparent));min-height:140px;display:flex;align-items:center;justify-content:center}
.rvc img{width:100%;max-width:420px;object-fit:contain}
.rvc .ph{font-size:96px}
.rvc .nm{font-size:24px;font-weight:600;margin-top:10px}
.rvc .sub{color:var(--k);font-size:13px;margin:2px 0 6px}
.rvc .vv{font-size:20px;font-weight:600;color:var(--gold);margin-bottom:18px}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none}
@media(prefers-reduced-motion:reduce){.strip,.wheelwrap canvas{transition-duration:.01s!important}.rays,.rvc,.wheelwrap.win{animation:none}}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
footer{text-align:center;color:var(--mute);font-size:11px;padding:10px 16px 24px}
</style>
</head>
<body>
<header>
  <div class="logo">OXAD</div>
  <div class="bal"><div class="chip"><span class="coin"></span><b id="bal">0</b></div><button class="btn" id="bonus">Бонус +500</button></div>
</header>
<nav>
  <button data-t="cases" class="on">Кейсы</button>
  <button data-t="upgrade">Апгрейд</button>
  <button data-t="inv">Инвентарь</button>
</nav>

<main>
  <section class="tab on" id="cases"><h2>Кейсы</h2><div class="grid cases" id="caseGrid"></div></section>

  <section class="tab" id="upgrade">
    <h2>Апгрейд</h2>
    <div class="up">
      <div>
        <div class="panel">
          <h3>1. Ваши скины — отметьте, что поставить</h3>
          <div class="empty" id="upEmpty" hidden>Нет скинов. Откройте кейс.</div>
          <div class="scroll"><div class="grid" id="upInv"></div></div>
        </div>
        <div class="panel">
          <h3>2. Желаемый скин</h3>
          <div class="empty" id="tEmpty">Сначала выберите скины</div>
          <div class="scroll"><div class="grid" id="targets"></div></div>
        </div>
      </div>
      <div class="panel wheelpanel">
        <div class="wheelwrap" id="ww">
          <div class="ptr"></div>
          <canvas id="wheel" width="560" height="560"></canvas>
          <div class="wc"><div class="num" id="chance">—</div><small id="upInfo">выберите скины</small></div>
        </div>
        <button class="btn main" id="upBtn" disabled>Апгрейд</button>
        <div class="msg" id="upMsg"></div>
      </div>
    </div>
  </section>

  <section class="tab" id="inv">
    <div class="row sp"><h2 style="margin:0">Инвентарь</h2><button class="btn" id="sellAll">Продать всё</button></div>
    <p class="empty" style="padding:6px 0 10px">Нажмите на скин, чтобы продать его</p>
    <div class="panel"><div class="empty" id="invEmpty" hidden>Пока пусто.</div><div class="scroll" style="max-height:60vh"><div class="grid" id="invGrid"></div></div></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box">
  <div class="row sp"><h2 id="mTitle" style="margin:0"></h2><button class="btn" id="mClose">Закрыть</button></div>
  <div class="roll"><div class="strip" id="strip"></div></div>
  <div class="row"><button class="btn main" id="openBtn"></button></div>
  <div class="msg" id="mMsg"></div>
  <div class="pool" id="pool"></div>
</div></div>

<div id="rv"><div class="rays"></div>
  <div class="rvc">
    <div class="t" id="rvT"></div>
    <div class="pic" id="rvPic"></div>
    <div class="nm" id="rvN"></div><div class="sub" id="rvS"></div><div class="vv" id="rvV"></div>
    <div class="row"><button class="btn main" id="rvOk">Забрать</button><button class="btn" id="rvSell"></button></div>
  </div>
</div>
<canvas id="fx"></canvas>
<footer>Игровая валюта и скины виртуальные. Реальных денег и вывода нет. Фанатский проект.</footer>

<script src="skins.js"></script>
<script>
const RC={c:'#8d9aa0',u:'#5fa8a0',r:'#5b8fd6',e:'#a56bd0',l:'#e0a53a'};
const RN={c:'Обычный',u:'Необычный',r:'Редкий',e:'Эпический',l:'Легендарный'};
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ru-RU');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const skin=id=>SKINS.find(s=>s.id===id);
let S;try{S=JSON.parse(localStorage.getItem('oxad2'))}catch(e){}
if(!S||typeof S.bal!=='number')S={bal:1000,inv:[],bonusAt:0,id:1};
S.inv=S.inv.filter(i=>skin(i.sid));
const save=()=>{try{localStorage.setItem('oxad2',JSON.stringify(S))}catch(e){}};

function card(sk,cls='',attr=''){
  const pic=sk.img?`<img src="${sk.img}" alt="" loading="lazy" onerror="this.outerHTML='🔫'">`:'🔫';
  return `<div class="card item ${cls}" ${attr} style="--k:${RC[sk.rarity]}"><div class="pic">${pic}</div><div class="n">${sk.name}</div><div class="v">${fmt(sk.value)}</div></div>`;
}
function roll(c){
  const rs=Object.keys(c.rar).filter(r=>SKINS.some(s=>s.rarity===r));
  let x=Math.random()*rs.reduce((a,r)=>a+c.rar[r],0),rar=rs[0];
  for(const r of rs){if((x-=c.rar[r])<0){rar=r;break}}
  return pick(SKINS.filter(s=>s.rarity===rar));
}

/* ---- эффект выигрыша ---- */
function confetti(col){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.5,vx:rnd(-8,8),vy:rnd(-15,-3),s:rnd(5,10),r:rnd(0,6),vr:rnd(-.3,.3),c:pick([col,col,'#f0be5c','#ece6d9'])}));
  let f=0;(function t(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.vy+=.28;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<170)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height);
  })();
}
const closeRv=()=>$('rv').classList.remove('on');
function reveal(title,sk,itemId){
  $('rv').style.setProperty('--k',RC[sk.rarity]);
  $('rvT').textContent=title;
  $('rvPic').innerHTML=sk.img?`<img src="${sk.img}" alt="" onerror="this.outerHTML='<div class=ph>🔫</div>'">`:'<div class="ph">🔫</div>';
  $('rvN').textContent=sk.name;
  $('rvS').textContent=RN[sk.rarity]+(sk.collection?' · '+sk.collection:'');
  $('rvV').textContent=fmt(sk.value);
  $('rvSell').textContent='Продать за '+fmt(sk.value);
  $('rvSell').onclick=()=>{
    const it=S.inv.find(i=>i.id===itemId);
    if(it){S.bal+=sk.value;S.inv=S.inv.filter(i=>i!==it);renderAll();if(cur)updOpen()}
    closeRv();
  };
  const el=$('rv');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
  confetti(RC[sk.rarity]);
}
$('rvOk').onclick=closeRv;

/* ---- общее ---- */
function renderAll(){
  $('bal').textContent=fmt(S.bal);save();
  $('invEmpty').hidden=S.inv.length>0;$('sellAll').disabled=!S.inv.length;
  $('invGrid').innerHTML=S.inv.map(i=>card(skin(i.sid),'pick',`data-i="${i.id}"`)).join('');
  $('invGrid').querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    const it=S.inv.find(i=>i.id==el.dataset.i);if(!it)return;
    S.bal+=skin(it.sid).value;S.inv=S.inv.filter(i=>i!==it);renderAll();
  });
  renderUp();
}
$('sellAll').onclick=()=>{S.bal+=S.inv.reduce((a,i)=>a+skin(i.sid).value,0);S.inv=[];renderAll()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on');
});
$('bonus').onclick=()=>{if(S.bonusAt+3e5>Date.now())return;S.bal+=500;S.bonusAt=Date.now();renderAll()};
setInterval(()=>{const l=S.bonusAt+3e5-Date.now();$('bonus').textContent=l>0?'Бонус через '+Math.ceil(l/1000)+' с':'Бонус +500'},1000);

/* ---- кейсы ---- */
$('caseGrid').innerHTML=CASES.map(c=>`<div class="card case" data-id="${c.id}" style="--k:${c.k}"><div class="ico">${c.ico}</div><div class="nm">${c.name}</div><div class="price">${fmt(c.price)}</div></div>`).join('');
document.querySelectorAll('.case').forEach(el=>el.onclick=()=>openModal(CASES.find(c=>c.id===el.dataset.id)));
let cur=null,busy=false;
const updOpen=()=>{$('openBtn').disabled=busy||S.bal<cur.price};
function openModal(c){
  cur=c;$('mTitle').textContent=c.name;$('openBtn').textContent='Открыть за '+fmt(c.price);$('mMsg').textContent='';
  $('strip').style.transition='none';$('strip').style.transform='none';
  $('strip').innerHTML=Array.from({length:12},()=>card(roll(c))).join('');
  $('pool').innerHTML=SKINS.filter(s=>c.rar[s.rarity]).map(s=>`<span style="--k:${RC[s.rarity]}">${s.name}</span>`).join('');
  $('modal').classList.add('on');updOpen();
}
$('mClose').onclick=()=>{if(!busy)$('modal').classList.remove('on')};
$('openBtn').onclick=()=>{
  if(busy||S.bal<cur.price)return;busy=true;S.bal-=cur.price;$('bal').textContent=fmt(S.bal);updOpen();$('mMsg').textContent='';
  const W=40,items=Array.from({length:50},()=>roll(cur)),win=roll(cur);items[W]=win;
  const st=$('strip');st.style.transition='none';st.style.transform='translateX(0)';
  st.innerHTML=items.map(s=>card(s)).join('');void st.offsetWidth;
  const x=W*108+54+rnd(-40,40)-st.parentElement.clientWidth/2;
  st.style.transition='transform 6s cubic-bezier(.1,.6,.1,1)';st.style.transform=`translateX(${-x}px)`;
  setTimeout(()=>{
    const id=S.id++;S.inv.push({id,sid:win.id});busy=false;
    renderAll();updOpen();
    setTimeout(()=>reveal('Вам выпало',win,id),450);
  },6100);
};

/* ---- апгрейд ---- */
let sel=new Set(),tgt=null,spinning=false,rot=0;
const sumSel=()=>S.inv.filter(i=>sel.has(i.id)).reduce((a,i)=>a+skin(i.sid).value,0);
const chanceOf=(sum,t)=>Math.min(90,95*sum/t.value);
function renderUp(){
  sel=new Set([...sel].filter(id=>S.inv.some(i=>i.id===id)));
  $('upEmpty').hidden=S.inv.length>0;
  $('upInv').innerHTML=S.inv.map(i=>card(skin(i.sid),'pick'+(sel.has(i.id)?' sel':''),`data-i="${i.id}"`)).join('');
  $('upInv').querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    if(spinning)return;const id=+el.dataset.i;sel.has(id)?sel.delete(id):sel.add(id);tgt=null;renderUp();
  });
  const sum=sumSel();
  const list=sel.size?SKINS.filter(s=>s.value>sum).sort((a,b)=>a.value-b.value):[];
  if(tgt&&!list.includes(tgt))tgt=null;
  $('tEmpty').hidden=list.length>0;
  $('tEmpty').textContent=sel.size?'Нет скинов дороже выбранных':'Сначала выберите скины';
  $('targets').innerHTML=list.map(s=>card(s,'pick'+(s===tgt?' sel':''),`data-s="${s.id}"`)).join('');
  $('targets').querySelectorAll('.item').forEach(el=>el.onclick=()=>{if(!spinning){tgt=skin(el.dataset.s);renderUp()}});
  const ch=tgt?chanceOf(sum,tgt):0;
  $('chance').textContent=tgt?ch.toFixed(1)+'%':'—';
  $('upInfo').textContent=tgt?`${fmt(sum)} → ${fmt(tgt.value)}`:(sel.size?'выберите цель':'выберите скины');
  $('upBtn').disabled=!tgt||spinning;
  drawWheel(ch);
}
function drawWheel(ch){
  const c=$('wheel'),x=c.getContext('2d'),s=c.width,m=s/2,W=44,R=m-W/2-14,P=Math.PI*2;
  x.clearRect(0,0,s,s);x.lineWidth=W;
  let g=x.createLinearGradient(0,0,s,s);
  if(ch>0){g.addColorStop(0,'#ea7a6d');g.addColorStop(1,'#a63a35')}else{g.addColorStop(0,'#46515b');g.addColorStop(1,'#343d45')}
  x.strokeStyle=g;x.beginPath();x.arc(m,m,R,0,P);x.stroke();
  if(ch>0){
    g=x.createLinearGradient(0,s,s,0);g.addColorStop(0,'#45b873');g.addColorStop(1,'#b2e67f');
    x.strokeStyle=g;x.beginPath();x.arc(m,m,R,-P/4,-P/4+ch/100*P);x.stroke();
  }
  x.lineWidth=3;x.strokeStyle='#00000040';
  for(let i=0;i<60;i++){const a=i/60*P,r1=R+W/2-9,r2=R+W/2;x.beginPath();x.moveTo(m+Math.cos(a)*r1,m+Math.sin(a)*r1);x.lineTo(m+Math.cos(a)*r2,m+Math.sin(a)*r2);x.stroke()}
  x.lineWidth=2;x.strokeStyle='#ffffff30';
  [R+W/2,R-W/2].forEach(r=>{x.beginPath();x.arc(m,m,r,0,P);x.stroke()});
}
$('upBtn').onclick=()=>{
  if(spinning||!tgt)return;
  const sum=sumSel(),ch=chanceOf(sum,tgt),res=Math.random()*100,win=res<ch,t=tgt,ww=$('ww');
  S.inv=S.inv.filter(i=>!sel.has(i.id));sel.clear();tgt=null;spinning=true;
  $('upBtn').disabled=true;$('upMsg').textContent='';$('upMsg').className='msg';ww.className='wheelwrap';
  rot=rot-(rot%360)+360*6+((-res*3.6)%360+360)%360;
  $('wheel').style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{
    spinning=false;
    if(win){
      const id=S.id++;S.inv.push({id,sid:t.id});ww.classList.add('win');
      $('upMsg').className='msg w';$('upMsg').textContent='Успех!';
      renderAll();setTimeout(()=>reveal('Апгрейд удался',t,id),600);
    }else{
      ww.classList.add('lose');$('upMsg').className='msg l';$('upMsg').textContent='Не повезло — скины потеряны';
      renderAll();
    }
  },5100);
};

renderAll();
</script>
