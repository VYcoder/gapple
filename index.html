<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYC - Visual Your Code</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --field: #090d13;
            --green: #00ff66;
            --cyan: #00f0ff;
            --text: #c9d1d9;
            --border: #30363d;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* ===== ЗАГРУЗОЧНЫЙ ЭКРАН ===== */
        #loader {
            position: fixed;
            inset: 0;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-logo {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--cyan);
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            animation: logoPulse 1.5s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); transform: scale(1); }
            50%      { text-shadow: 0 0 30px rgba(0, 240, 255, 1), 0 0 50px rgba(0, 255, 102, 0.5); transform: scale(1.05); }
        }
        .loader-bar {
            width: 260px;
            height: 6px;
            background: #090d13;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--green), var(--cyan));
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.7);
            animation: loadFill 2s ease forwards;
        }
        @keyframes loadFill {
            0%   { width: 0%; }
            30%  { width: 35%; }
            60%  { width: 60%; }
            100% { width: 100%; }
        }
        .loader-text {
            font-size: 0.9rem;
            color: var(--green);
            letter-spacing: 1px;
            min-height: 1.2em;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }
        .loader-cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background: var(--green);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ===== ОКНА ===== */
        .window {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: none;
        }
        .window.visible {
            display: block;
            animation: windowIn 0.4s ease;
        }
        @keyframes windowIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        h1.brand-title {
            color: var(--cyan);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        h2 {
            color: var(--green);
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .input-text, textarea {
            width: 100%;
            background: var(--field);
            border: 1px solid var(--border);
            color: #fff;
            padding: 14px;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        textarea {
            height: 150px;
            resize: none;
        }
        .btn {
            width: 100%;
            background: var(--green);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.95rem;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover {
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
            background: #00e65c;
        }
        .btn-cyan {
            background: var(--cyan);
        }
        .btn-cyan:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            background: #00d8e6;
        }
        .btn-sec {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border);
        }
        .btn-sec:hover {
            background: #30363d;
        }
        .console-box {
            background: #000;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 6px;
            min-height: 60px;
            white-space: pre-wrap;
            color: var(--cyan);
            font-size: 0.95rem;
            margin-top: 15px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }
        .library-list {
            background: var(--field);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .library-item {
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .del-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
