<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OXAD — симулятор кейсов Oxide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23e3a93c'/%3E%3Ccircle cx='50' cy='50' r='36' fill='%2314171a'/%3E%3Cpath d='M52 20c3 12 20 21 20 40a20 20 0 0 1-40 0c0-8 4-14 8-18 1 6 4 9 8 11-2-12 2-22 4-33z' fill='%23e3a93c'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#14181c;--panel:#21282f;--soft:#2a323a;--line:#ffffff12;--text:#ece6d9;--mute:#8f9aa3;--rust:#e0713f;--rust2:#c4472b;--gold:#f0be5c;--win:#6ed08a;--lose:#e0675c;--r:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
button,.pick,.case{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{overflow-x:hidden}
body{background:radial-gradient(900px 500px at 50% -120px,#2b3540,transparent),var(--bg);color:var(--text);font:400 14px/1.4 Inter,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
header{max-width:900px;margin:0 auto;padding:16px 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:600;letter-spacing:.08em;background:linear-gradient(90deg,var(--rust),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{display:flex;gap:8px;align-items:center}
.chip{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
.cn{flex:none;display:inline-block;vertical-align:-3px}
.chip b{font-size:16px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.btn svg{vertical-align:-3px;margin:0 2px}
.btn{background:var(--soft);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--rust);background:#323b44}
.btn.main{background:linear-gradient(180deg,var(--rust),var(--rust2));border:0;font-weight:500;font-size:15px;padding:12px 34px;box-shadow:0 6px 18px #e0713f44}
.btn.main:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(180deg,var(--rust),var(--rust2))}
.btn:disabled{opacity:.4;cursor:not-allowed}
nav{display:flex;gap:4px;padding:4px;margin:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:999px;max-width:420px}
@media(min-width:900px){nav{margin:0 auto 0 calc(50% - 450px + 16px)}}
nav button{flex:1;border:0;background:none;padding:9px 6px;border-radius:999px;cursor:pointer;color:var(--mute);transition:.15s}
nav button.on{background:var(--soft);color:var(--text);box-shadow:0 0 0 1px var(--line)}
main{max-width:900px;margin:0 auto;padding:18px 16px 40px}
.tab{display:none}.tab.on{display:block}
h2{font-size:18px;font-weight:600;margin-bottom:12px}
h3{font-size:13px;font-weight:500;color:var(--mute);margin-bottom:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.scroll{max-height:210px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3b454e transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cases{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.case{cursor:pointer;padding:20px 10px;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 0,color-mix(in srgb,var(--k) 26%,transparent),transparent 70%),var(--panel);transition:.2s}
.case:hover{transform:translateY(-3px);border-color:var(--k);box-shadow:0 10px 26px color-mix(in srgb,var(--k) 25%,transparent)}
.case .ico{font-size:52px;line-height:1.2;filter:drop-shadow(0 6px 10px #0008)}
.case .nm{font-size:14px;font-weight:500;margin:6px 0 2px}
.v,.price{color:var(--gold);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:4px}
.item{background:linear-gradient(180deg,color-mix(in srgb,var(--k) 18%,var(--soft)),var(--soft) 80%);border-bottom:2px solid var(--k)}
.item .pic{height:46px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
.item img{max-width:100%;max-height:46px;object-fit:contain}
.item .n{font-size:11.5px;line-height:1.25;height:29px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-top:2px}
.pick{cursor:pointer;transition:.12s}.pick:hover{filter:brightness(1.15)}
.pick.sel{outline:2px solid var(--rust);outline-offset:-2px;box-shadow:0 0 14px #e0713f55}
.empty{color:var(--mute);text-align:center;padding:16px 8px;font-size:13px}
.up{display:grid;gap:12px}
@media(min-width:760px){.up{grid-template-columns:1fr 290px;align-items:start}}
.up>*{min-width:0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
.modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:16px;max-height:92vh;overflow:auto}
.roll{position:relative;overflow:hidden;background:#101417;border-radius:12px;margin:12px 0}
.roll::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);transform:translateX(-50%);z-index:2}
.strip{display:flex;gap:8px;padding:8px 0;will-change:transform}
.strip .item{flex:0 0 100px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.sp{justify-content:space-between}
.pool{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:11px;color:var(--mute)}
.pool span{border-bottom:2px solid var(--k);padding:2px 7px;background:var(--soft);border-radius:6px}
/* колесо */
.wheelpanel{text-align:center;background:radial-gradient(circle at 50% 38%,#2d3a46,var(--panel) 70%)}
.wheelwrap{position:relative;width:240px;height:240px;margin:14px auto 18px;border-radius:50%;box-shadow:0 0 0 6px #ffffff08,0 0 40px #0008}
.wheelwrap canvas{width:100%;height:100%;display:block;transition:transform 5s cubic-bezier(.1,.75,.12,1)}

.wheelwrap.lose{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);border:10px solid transparent;border-top:20px solid var(--gold);filter:drop-shadow(0 2px 6px #000a);z-index:2}
.wc{position:absolute;inset:18%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle at 50% 30%,#2e3842,#171c20);box-shadow:inset 0 0 0 1px #ffffff10,inset 0 8px 20px #0006}
.wc .num{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}.wc small{color:var(--mute);font-size:11px;margin-top:2px}
.msg{min-height:24px;text-align:center;font-size:15px;font-weight:500;margin-top:10px}
.msg.w{color:var(--win)}.msg.l{color:var(--lose)}
/* показ выигрыша */
#rv{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--k) 26%,#0b0e11),#0b0e11 78%);overflow:hidden}
#rv.on{display:flex}
#rv::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 0,#0b0e11e6 72%)}
.rays{position:absolute;left:50%;top:50%;z-index:0;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--k) 20%,transparent) 0 8deg,transparent 8deg 16deg);animation:spin 50s linear infinite;will-change:transform}
#rv.leg .rays{background:repeating-conic-gradient(#e0a53a3a 0 8deg,transparent 8deg 16deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.rvc{position:relative;z-index:2;text-align:center;max-width:460px;width:100%;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.rvc .t{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.rvc .pic{position:relative;min-height:140px;display:flex;align-items:center;justify-content:center}
.rvc .pic::before{content:"";position:absolute;inset:-40% -14%;background:radial-gradient(closest-side,color-mix(in srgb,var(--k) 55%,transparent),transparent);animation:pulse 2.4s ease-in-out infinite}
#rv.leg .pic::before{background:radial-gradient(closest-side,#ffd36cc0,#e0a53a55 45%,transparent)}
.rvc .pic::after{content:"";position:absolute;left:8%;right:8%;bottom:-16px;height:28px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--k) 60%,transparent),transparent)}
.rvc .pic>*{position:relative;z-index:1}
@keyframes pulse{50%{opacity:.6;transform:scale(1.06)}}
.rvc img{width:100%;max-width:420px;max-height:40vh;object-fit:contain}
.rvc .ph{font-size:96px}
.rvc .nm{font-size:26px;font-weight:600;margin-top:22px}
#rv.leg .nm{background:linear-gradient(90deg,#fff1bd,#f0be5c,#fff1bd);-webkit-background-clip:text;background-clip:text;color:transparent}
.rvc .sub{color:var(--k);font-size:13px;margin:2px 0 8px}
.rvc .vv{font-size:20px;font-weight:600;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:6px}
.tw{position:absolute;z-index:1;width:6px;height:6px;border-radius:50%;background:#fff3c4;box-shadow:0 0 8px #ffd36c;opacity:0;display:none}
#rv.leg .tw{display:block;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.item.leg{box-shadow:0 0 12px #e0a53a40}
body.rvo header,body.rvo nav,body.rvo main,body.rvo footer,body.rvo .modal{visibility:hidden}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none}
@media(prefers-reduced-motion:reduce){.strip,.wheelwrap canvas{transition-duration:.01s!important}.rays,.rvc,.wheelwrap.win::after,.rvc .pic::before,.tw{animation:none}}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
footer{text-align:center;color:var(--mute);font-size:11px;padding:10px 16px 24px}

/* ===== украшения ===== */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 380px at 6% 14%,#e0713f18,transparent),radial-gradient(560px 420px at 96% 62%,#a56bd016,transparent)}
header{border-bottom:1px solid #ffffff0a}
.logo{font-size:24px;text-shadow:0 0 24px #e0713f55}
nav button.on{background:linear-gradient(180deg,#38424b,#2d353d);box-shadow:0 0 0 1px #ffffff14,0 4px 12px #0006}
h2{display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#ffffff1a,transparent);margin-left:4px}
.row.sp h2::after,#mTitle::after{display:none}
.panel{box-shadow:inset 0 1px 0 #ffffff0d,0 8px 24px #0004}
.tab.on{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.case{padding:12px 10px 14px;position:relative;overflow:hidden}
.case::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--k),transparent)}
.art{position:relative;height:92px;margin-bottom:8px}
.art::after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:20px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--k) 50%,transparent),transparent)}
.art .p{position:absolute;left:50%;bottom:6px;width:72%;max-height:80px;object-fit:contain;transform-origin:50% 100%}
.art .p0{transform:translateX(-50%);z-index:3}
.art .p1{transform:translateX(-84%) rotate(-11deg) scale(.8);z-index:2;opacity:.92}
.art .p2{transform:translateX(-16%) rotate(11deg) scale(.8);z-index:1;opacity:.92}
.case .nm{font-size:15px;margin:2px 0 4px}
.case .price{display:inline-flex;background:#00000033;border-radius:999px;padding:3px 12px 3px 8px;font-size:14px}
.roll::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#101417 0,transparent 16%,transparent 84%,#101417 100%)}
.roll{box-shadow:inset 0 0 0 1px #ffffff0d}
.wheelwrap::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 20deg,#e0a53a66,#ffffff10 25%,#e0a53a66 50%,#ffffff10 75%,#e0a53a66);-webkit-mask:radial-gradient(circle,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(circle,transparent calc(100% - 9px),#000 calc(100% - 8px))}
.wheelwrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--win);opacity:0;pointer-events:none}
.wheelwrap.win::after{animation:ringp 1.1s ease-out 2}
@keyframes ringp{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.4)}}
.wheelwrap canvas{position:relative;z-index:1}
.wc{z-index:2}
.btn.main{position:relative;overflow:hidden}
.btn.main:active:not(:disabled){transform:scale(.97)}

/* ===== несколько кейсов ===== */
.cnt{display:flex;gap:6px;justify-content:center;align-items:center;margin:4px 0 14px}
.cnt::before{content:"Открыть:";color:var(--mute);font-size:13px;margin-right:6px}
.cnt button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-weight:500;font-size:15px}
.cnt button.on{background:linear-gradient(180deg,var(--rust),var(--rust2));border-color:transparent;box-shadow:0 4px 12px #e0713f44}
.cnt button:disabled{opacity:.35;cursor:not-allowed}
.roll{margin:8px 0}
.strip.sm .item{flex:0 0 72px;padding:5px 4px}
.strip.sm .item .n,.strip.sm .item .v{display:none}
.strip.sm .item .pic{height:46px}
.rvm{position:relative;z-index:2;text-align:center;max-width:560px;width:100%;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.rvm .t{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
#rv:not(.multi) .rvm,#rv.multi .rvc{display:none}
.mg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
.mi{flex:0 0 calc(50% - 5px);background:linear-gradient(180deg,color-mix(in srgb,var(--k) 20%,var(--soft)),var(--soft) 85%);border-bottom:2px solid var(--k);border-radius:12px;padding:10px 8px}
.mi img{width:100%;height:62px;object-fit:contain}
.mi .n{font-size:12px;margin-top:4px;min-height:30px;display:flex;align-items:center;justify-content:center}
.mi .v{display:flex;align-items:center;justify-content:center;gap:4px;color:var(--gold);font-weight:500;font-size:13px}
@media(min-width:560px){.mi{flex-basis:calc(33.33% - 7px)}}
.case.soon{cursor:default;opacity:.55}
.case.soon:hover{transform:none;border-color:var(--line);box-shadow:none}
.case.soon .art{display:flex;align-items:center;justify-content:center}
.case.soon .art::after{display:none}
.case.soon .art span{font-size:13px;color:var(--mute);border:1px dashed #ffffff30;border-radius:999px;padding:5px 14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset=".5" stop-color="#e3a93c"/><stop offset="1" stop-color="#9c6a1c"/></linearGradient></defs>
<symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11.4" fill="url(#cg)"/><circle cx="12" cy="12" r="9" fill="#14171a"/><circle cx="12" cy="12" r="9" fill="none" stroke="#e3a93c" stroke-width=".6"/><path d="M12.2 4.6c.6 2.5 4.2 4.4 4.2 8.2a4.4 4.4 0 0 1-8.8 0c0-1.5.7-2.7 1.5-3.5.1 1.2.7 1.9 1.5 2.2-.3-2.2.4-4.2 1.6-6.9z" fill="url(#cg)"/><path d="M12 12.4c1 1.1 1.8 1.9 1.8 2.9a1.8 1.8 0 0 1-3.6 0c0-1 .8-1.8 1.8-2.9z" fill="#14171a"/></symbol></svg>
<header>
  <div class="logo">OXAD</div>
  <div class="bal"><div class="chip"><svg class="cn" width="22" height="22"><use href="#coin"/></svg><b id="bal">0</b></div><button class="btn" id="bonus">Бонус +100</button></div>
</header>
<nav>
  <button data-t="cases" class="on">Кейсы</button>
  <button data-t="upgrade">Апгрейд</button>
  <button data-t="inv">Инвентарь</button>
</nav>

<main>
  <section class="tab on" id="cases"><h2>Кейсы</h2><div class="grid cases" id="caseGrid"></div></section>

  <section class="tab" id="upgrade">
    <h2>Апгрейд</h2>
    <div class="up">
      <div>
        <div class="panel">
          <h3>1. Ваши скины — отметьте, что поставить</h3>
          <div class="empty" id="upEmpty" hidden>Нет скинов. Откройте кейс.</div>
          <div class="scroll"><div class="grid" id="upInv"></div></div>
        </div>
        <div class="panel">
          <h3>2. Желаемый скин</h3>
          <div class="empty" id="tEmpty">Сначала выберите скины</div>
          <div class="scroll"><div class="grid" id="targets"></div></div>
        </div>
      </div>
      <div class="panel wheelpanel">
        <div class="wheelwrap" id="ww">
          <div class="ptr"></div>
          <canvas id="wheel" width="560" height="560"></canvas>
          <div class="wc"><div class="num" id="chance">—</div><small id="upInfo">выберите скины</small></div>
        </div>
        <button class="btn main" id="upBtn" disabled>Апгрейд</button>
        <div class="msg" id="upMsg"></div>
      </div>
    </div>
  </section>

  <section class="tab" id="inv">
    <div class="row sp"><h2 style="margin:0">Инвентарь</h2><button class="btn" id="sellAll">Продать всё</button></div>
    <p class="empty" id="invHint" style="padding:6px 0 10px"></p>
    <div class="panel"><div class="empty" id="invEmpty" hidden>Пока пусто.</div><div class="scroll" style="max-height:60vh"><div class="grid" id="invGrid"></div></div></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box">
  <div class="row sp"><h2 id="mTitle" style="margin:0"></h2><button class="btn" id="mClose">Закрыть</button></div>
  <div id="rolls"></div>
  <div class="cnt" id="cnt"></div>
  <div class="row"><button class="btn main" id="openBtn"></button></div>
  <div class="msg" id="mMsg"></div>
  <div class="pool" id="pool"></div>
</div></div>

<div id="rv"><div class="rays"></div><div id="twk"></div>
  <div class="rvm">
    <div class="t">Вам выпало</div>
    <div class="mg" id="mg"></div>
    <div class="vv" id="mv"></div>
    <div class="row"><button class="btn main" id="mOk">Забрать всё</button><button class="btn" id="mSell"></button></div>
  </div>
  <div class="rvc">
    <div class="t" id="rvT"></div>
    <div class="pic" id="rvPic"></div>
    <div class="nm" id="rvN"></div><div class="sub" id="rvS"></div><div class="vv" id="rvV"></div>
    <div class="row"><button class="btn main" id="rvOk">Забрать</button><button class="btn" id="rvSell"></button></div>
  </div>
</div>
<canvas id="fx"></canvas>
<footer>Игровая валюта и скины виртуальные. Реальных денег и вывода нет. Фанатский проект.</footer>

<script src="skins.js"></script>
<script>
const RC={c:'#8d9aa0',u:'#5fa8a0',r:'#5b8fd6',e:'#a56bd0',l:'#e0a53a'};
const RN={c:'Обычный',u:'Необычный',r:'Редкий',e:'Эпический',l:'Легендарный'};
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ru-RU');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const skin=id=>SKINS.find(s=>s.id===id);
function onEnd(el,ms,fn){let d=0;const h=e=>{if(e.target===el&&e.propertyName==='transform')f()};const f=()=>{if(d)return;d=1;el.removeEventListener('transitionend',h);fn()};el.addEventListener('transitionend',h);setTimeout(f,ms+120)}
const coin=(z=14)=>`<svg class="cn" width="${z}" height="${z}"><use href="#coin"/></svg>`;
let S;try{S=JSON.parse(localStorage.getItem('oxad4'))}catch(e){}
if(!S||typeof S.bal!=='number')S={bal:1500,inv:[],bonusAt:0,id:1};
S.inv=S.inv.filter(i=>skin(i.sid));
const save=()=>{try{localStorage.setItem('oxad4',JSON.stringify(S))}catch(e){}};

function card(sk,cls='',attr=''){
  const ic='';
  const pic=sk.img?`<img src="${sk.img}" alt="" decoding="async" onerror="this.outerHTML='${ic}'">`:ic;
  return `<div class="card item ${cls}${sk.rarity==='l'?' leg':''}" ${attr} style="--k:${RC[sk.rarity]}"><div class="pic">${pic}</div><div class="n">${sk.name}</div><div class="v">${coin(12)}${fmt(sk.value)}</div></div>`;
}
const poolOf=c=>SKINS.filter(s=>!c.weapons||c.weapons.includes(s.weapon));
const wt=(c,sk)=>(c.cw&&c.cw[sk.id])||1;
function odds(c){
  const P=poolOf(c).filter(s=>c.rar[s.rarity]),g={};
  P.forEach(s=>g[s.rarity]=(g[s.rarity]||0)+wt(c,s));
  const t=Object.keys(g).reduce((a,r)=>a+c.rar[r],0);
  return P.map(s=>({s,p:c.rar[s.rarity]/t*wt(c,s)/g[s.rarity]}));
}
function roll(c){
  const L=odds(c);if(!L.length)return SKINS[0];let x=Math.random();
  for(const o of L){if((x-=o.p)<0)return o.s}
  return L[L.length-1].s;
}

/* ---- эффект выигрыша ---- */
let fxT=0;
function confetti(col){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const id=++fxT,c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:80},()=>({x:innerWidth/2,y:innerHeight*.5,vx:rnd(-8,8),vy:rnd(-15,-3),s:rnd(5,10),r:rnd(0,6),vr:rnd(-.3,.3),c:pick([col,col,'#f0be5c','#ece6d9'])}));
  let f=0;(function t(){
    if(id!==fxT){x.clearRect(0,0,c.width,c.height);return}
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.vy+=.28;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<130)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height);
  })();
}
const closeRv=()=>{$('rv').classList.remove('on');document.body.classList.remove('rvo');fxT++};
function reveal(title,sk,itemId){
  $('rv').style.setProperty('--k',RC[sk.rarity]);$('rv').classList.toggle('leg',sk.rarity==='l');
  $('rvT').textContent=title;
  const ic='';
  $('rvPic').innerHTML=sk.img?`<img src="${sk.img}" alt="" onerror="this.outerHTML='<div class=ph>${ic}</div>'">`:`<div class="ph">${ic}</div>`;
  $('rvN').textContent=sk.name;
  $('rvS').textContent=RN[sk.rarity]+(sk.collection?' · '+sk.collection:'');
  $('rvV').innerHTML=coin(20)+fmt(sk.value);
  $('rvSell').innerHTML='Продать за '+coin(14)+fmt(sk.value);
  $('rvSell').onclick=()=>{
    const it=S.inv.find(i=>i.id===itemId);
    if(it){S.bal+=sk.value;S.inv=S.inv.filter(i=>i!==it);renderAll();if(cur)updOpen()}
    closeRv();
  };
  const el=$('rv');el.classList.remove('multi','on');void el.offsetWidth;el.classList.add('on');document.body.classList.add('rvo');
  setTimeout(()=>{if(el.classList.contains('on'))confetti(RC[sk.rarity])},420);
}
$('rvOk').onclick=closeRv;$('mOk').onclick=closeRv;
function revealMulti(list){
  const el=$('rv'),rk=o=>'curel'.indexOf(o.sk.rarity),best=list.reduce((a,b)=>rk(b)>rk(a)?b:a),tot=list.reduce((a,o)=>a+o.sk.value,0);
  el.style.setProperty('--k',RC[best.sk.rarity]);
  el.classList.toggle('leg',list.some(o=>o.sk.rarity==='l'));
  $('mg').innerHTML=list.map(o=>`<div class="mi" style="--k:${RC[o.sk.rarity]}">${o.sk.img?`<img src="${o.sk.img}" alt="" decoding="async" onerror="this.remove()">`:''}<div class="n">${o.sk.name}</div><div class="v">${coin(12)}${fmt(o.sk.value)}</div></div>`).join('');
  $('mv').innerHTML='Всего '+coin(20)+fmt(tot);
  $('mSell').innerHTML='Продать всё за '+coin(14)+fmt(tot);
  $('mSell').onclick=()=>{
    const ids=new Set(list.map(o=>o.id));let g=0;
    S.inv=S.inv.filter(i=>{if(ids.has(i.id)){g+=skin(i.sid).value;return false}return true});
    S.bal+=g;renderAll();if(cur)updOpen();closeRv();
  };
  el.classList.add('multi');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
  document.body.classList.add('rvo');
  setTimeout(()=>{if(el.classList.contains('on'))confetti(RC[best.sk.rarity])},420);
}
$('twk').innerHTML=Array.from({length:12},(_,i)=>`<span class="tw" style="left:${rnd(8,92).toFixed(0)}%;top:${rnd(8,88).toFixed(0)}%;animation-delay:${(i*.2).toFixed(1)}s"></span>`).join('');

/* ---- общее ---- */
function renderAll(){
  $('bal').textContent=fmt(S.bal);save();
  $('invEmpty').hidden=S.inv.length>0;$('sellAll').disabled=!S.inv.length;
  $('invHint').innerHTML='Нажмите на скин, чтобы продать его'+(S.inv.length?' · всего '+coin(12)+fmt(S.inv.reduce((a,i)=>a+skin(i.sid).value,0)):'');
  $('invGrid').innerHTML=S.inv.map(i=>card(skin(i.sid),'pick',`data-i="${i.id}"`)).join('');
  $('invGrid').querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    if(spinning||busy)return;const it=S.inv.find(i=>i.id==el.dataset.i);if(!it)return;
    S.bal+=skin(it.sid).value;S.inv=S.inv.filter(i=>i!==it);renderAll();
  });
  renderUp();
}
$('sellAll').onclick=()=>{if(spinning||busy)return;S.bal+=S.inv.reduce((a,i)=>a+skin(i.sid).value,0);S.inv=[];renderAll()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  if(spinning||busy)return;
  document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on');
});
$('bonus').onclick=()=>{if(spinning||busy||S.bonusAt+3e5>Date.now())return;S.bal+=100;S.bonusAt=Date.now();renderAll()};
setInterval(()=>{const l=S.bonusAt+3e5-Date.now();$('bonus').textContent=l>0?'Бонус через '+Math.ceil(l/1000)+' с':'Бонус +100'},1000);

/* ---- кейсы ---- */
$('caseGrid').innerHTML=CASES.map(c=>{
  const top=poolOf(c).filter(s=>c.rar[s.rarity]&&s.img).sort((a,b)=>b.value-a.value).slice(0,3);
  const art=top.map((s,i)=>`<img class="p p${i}" src="${s.img}" alt="" decoding="async" onerror="this.style.display='none'">`).join('');
  const soon=!poolOf(c).some(s=>c.rar[s.rarity]);
  return `<div class="card case${soon?' soon':''}" data-id="${c.id}" style="--k:${c.k}"><div class="art">${soon?'<span>Скоро</span>':art}</div><div class="nm">${c.name}</div><div class="price">${coin(14)}${fmt(c.price)}</div></div>`;
}).join('');
document.querySelectorAll('.case:not(.soon)').forEach(el=>el.onclick=()=>openModal(CASES.find(c=>c.id===el.dataset.id)));
let cur=null,busy=false;
let cnt=1;
const updOpen=()=>{
  const aff=Math.max(1,Math.min(5,Math.floor(S.bal/cur.price)));
  if(!busy&&cnt>aff)cnt=aff;
  $('cnt').innerHTML=[1,2,3,4,5].map(n=>`<button class="${n===cnt?'on':''}" data-n="${n}" ${busy||S.bal<cur.price*n?'disabled':''}>${n}</button>`).join('');
  $('openBtn').innerHTML='Открыть'+(cnt>1?' ×'+cnt:'')+' за '+coin(16)+fmt(cur.price*cnt);
  $('openBtn').disabled=busy||S.bal<cur.price*cnt;
};
function drawRolls(){
  $('rolls').innerHTML=Array.from({length:cnt},()=>`<div class="roll"><div class="strip${cnt>1?' sm':''}">${Array.from({length:cnt>1?10:12},()=>card(roll(cur))).join('')}</div></div>`).join('');
}
$('cnt').onclick=e=>{const b=e.target.closest('button');if(!b||busy||b.disabled)return;cnt=+b.dataset.n;drawRolls();updOpen()};
function openModal(c){
  cur=c;$('mTitle').textContent=c.name;$('mMsg').textContent='';
  $('pool').innerHTML=odds(c).sort((a,b)=>b.p-a.p).map(o=>`<span style="--k:${RC[o.s.rarity]}">${o.s.name} · ${(o.p*100).toFixed(o.p<.1?1:0)}%</span>`).join('');
  $('modal').classList.add('on');updOpen();drawRolls();
}
$('mClose').onclick=()=>{if(!busy)$('modal').classList.remove('on')};
$('openBtn').onclick=()=>{
  const n=cnt,total=cur.price*n;
  if(busy||S.bal<total)return;
  busy=true;S.bal-=total;$('bal').textContent=fmt(S.bal);updOpen();$('mMsg').textContent='';
  const sm=n>1,W=sm?26:40,N=sm?32:50,cell=sm?80:108,dur=sm?5:6,wins=[];
  $('rolls').innerHTML=Array.from({length:n},()=>`<div class="roll"><div class="strip${sm?' sm':''}"></div></div>`).join('');
  const strips=[...document.querySelectorAll('#rolls .strip')];
  strips.forEach(st=>{
    const items=Array.from({length:N},()=>roll(cur)),win=roll(cur);items[W]=win;
    const id=S.id++;S.inv.push({id,sid:win.id});wins.push({sk:win,id});
    st.innerHTML=items.map(k=>card(k)).join('');
  });
  save();
  void document.body.offsetWidth;
  strips.forEach(st=>{
    const x=W*cell+cell/2+rnd(-cell*.37,cell*.37)-st.parentElement.clientWidth/2;
    st.style.transition=`transform ${dur}s cubic-bezier(.1,.6,.1,1)`;st.style.transform=`translateX(${-x}px)`;
  });
  onEnd(strips[0],dur*1000,()=>{
    busy=false;
    if(n>1)revealMulti(wins);else reveal('Вам выпало',wins[0].sk,wins[0].id);
    renderAll();updOpen();
  });
};

/* ---- апгрейд ---- */
let sel=new Set(),tgt=null,spinning=false,rot=0;
const sumSel=()=>S.inv.filter(i=>sel.has(i.id)).reduce((a,i)=>a+skin(i.sid).value,0);
const chanceOf=(sum,t)=>Math.min(90,95*sum/t.value);
function renderUp(){
  sel=new Set([...sel].filter(id=>S.inv.some(i=>i.id===id)));
  $('upEmpty').hidden=S.inv.length>0;
  $('upInv').innerHTML=S.inv.map(i=>card(skin(i.sid),'pick'+(sel.has(i.id)?' sel':''),`data-i="${i.id}"`)).join('');
  $('upInv').querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    if(spinning)return;const id=+el.dataset.i;sel.has(id)?sel.delete(id):sel.add(id);tgt=null;renderUp();
  });
  const sum=sumSel();
  const list=sel.size?SKINS.filter(s=>s.value>sum).sort((a,b)=>a.value-b.value):[];
  if(tgt&&!list.includes(tgt))tgt=null;
  $('tEmpty').hidden=list.length>0;
  $('tEmpty').textContent=sel.size?'Нет скинов дороже выбранных':'Сначала выберите скины';
  $('targets').innerHTML=list.map(s=>card(s,'pick'+(s===tgt?' sel':''),`data-s="${s.id}"`)).join('');
  $('targets').querySelectorAll('.item').forEach(el=>el.onclick=()=>{if(!spinning){tgt=skin(el.dataset.s);renderUp()}});
  const ch=tgt?chanceOf(sum,tgt):0;
  $('chance').textContent=tgt?ch.toFixed(1)+'%':'—';
  $('upInfo').textContent=tgt?`${fmt(sum)} → ${fmt(tgt.value)}`:(sel.size?'выберите цель':'выберите скины');
  $('upBtn').disabled=!tgt||spinning;
  drawWheel(ch);
}
function drawWheel(ch){
  const c=$('wheel'),x=c.getContext('2d'),s=c.width,m=s/2,W=44,R=m-W/2-14,P=Math.PI*2;
  x.clearRect(0,0,s,s);x.lineWidth=W;
  let g=x.createLinearGradient(0,0,s,s);
  if(ch>0){g.addColorStop(0,'#ea7a6d');g.addColorStop(1,'#a63a35')}else{g.addColorStop(0,'#46515b');g.addColorStop(1,'#343d45')}
  x.strokeStyle=g;x.beginPath();x.arc(m,m,R,0,P);x.stroke();
  if(ch>0){
    g=x.createLinearGradient(0,s,s,0);g.addColorStop(0,'#45b873');g.addColorStop(1,'#b2e67f');
    x.strokeStyle=g;x.beginPath();x.arc(m,m,R,-P/4,-P/4+ch/100*P);x.stroke();
  }
  x.lineWidth=3;x.strokeStyle='#00000040';
  for(let i=0;i<60;i++){const a=i/60*P,r1=R+W/2-9,r2=R+W/2;x.beginPath();x.moveTo(m+Math.cos(a)*r1,m+Math.sin(a)*r1);x.lineTo(m+Math.cos(a)*r2,m+Math.sin(a)*r2);x.stroke()}
  x.lineWidth=2;x.strokeStyle='#ffffff30';
  [R+W/2,R-W/2].forEach(r=>{x.beginPath();x.arc(m,m,r,0,P);x.stroke()});
}
$('upBtn').onclick=()=>{
  if(spinning||!tgt)return;
  const sum=sumSel(),ch=chanceOf(sum,tgt),res=Math.random()*100,win=res<ch,t=tgt,ww=$('ww');
  S.inv=S.inv.filter(i=>!sel.has(i.id));sel.clear();tgt=null;spinning=true;
  let wid=0;if(win){wid=S.id++;S.inv.push({id:wid,sid:t.id})}
  save();
  $('upBtn').disabled=true;$('upMsg').textContent='';$('upMsg').className='msg';ww.className='wheelwrap';
  rot=rot-(rot%360)+360*6+((-res*3.6)%360+360)%360;
  $('wheel').style.transform=`rotate(${rot}deg)`;
  onEnd($('wheel'),5000,()=>{
    spinning=false;
    if(win){ww.classList.add('win');$('upMsg').className='msg w';$('upMsg').textContent='Успех!';reveal('Апгрейд удался',t,wid)}
    else{ww.classList.add('lose');$('upMsg').className='msg l';$('upMsg').textContent='Не повезло — скины потеряны'}
    renderAll();
  });
};

renderAll();
</script>
</body>
</html>
